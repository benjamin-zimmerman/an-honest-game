<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#efede6" />
  <meta name="description" content="The Noble Game. A game of chess." />
  <title>The Noble Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="masthead"><h1>The Noble Game</h1></header>
    <section class="game-layout" aria-label="Chess game">
      <div class="board-column">
        <div class="player-strip">
          <div><span class="player-name">OPPONENT</span><span class="player-meta">Black</span></div>
          <div class="indicator" id="aiIndicator" aria-live="polite">ready</div>
        </div>
        <div class="board-wrap"><div id="board" class="board" role="grid" aria-label="Chess board"></div></div>
        <div class="player-strip">
          <div><span class="player-name">YOU</span><span class="player-meta">White</span></div>
          <div class="indicator" id="humanIndicator">your move</div>
        </div>
      </div>
      <aside class="panel">
        <div class="status-block" aria-live="polite">
          <p class="panel-label">Position</p>
          <h2 id="statusText">Your move.</h2>
          <p id="statusDetail">Select a piece to see its moves.</p>
          <button id="retryBtn" class="button retry-button" hidden>Retry move</button>
        </div>
        <div class="controls">
          <div class="button-row"><button id="newGameBtn" class="button primary">New game</button><button id="resignBtn" class="button">Resign</button></div>
        </div>
        <div class="ledger-block">
          <div class="ledger-heading"><p class="panel-label">Public record</p><span id="moveCount">0 moves</span></div>
          <ol id="moveLog" class="move-log" aria-label="Move history"></ol>
          <p class="empty-ledger" id="emptyLedger">White to begin.</p>
        </div>
        <div class="audit-block">
          <button id="auditBtn" class="audit-button" disabled>Post-game audit</button>
          <p class="microcopy">Available when the game ends.</p>
        </div>
      </aside>
    </section>
  </main>
  <dialog id="promotionDialog" class="promotion-dialog" aria-label="Choose a promotion">
    <form method="dialog"><p>Choose a promotion.</p><div class="promotion-options" id="promotionOptions"></div><button class="dialog-cancel" value="cancel">Cancel</button></form>
  </dialog>
  <dialog id="auditDialog" class="audit-dialog" aria-labelledby="auditTitle">
    <form method="dialog"><p class="panel-label">Post-game audit</p><h2 id="auditTitle">Review complete.</h2><div id="auditContents" class="audit-contents"></div><button class="button primary" value="close">Close audit</button></form>
  </dialog>
  <script src="app-1.js"></script>
  <script src="app-2.js"></script>
  <script src="app-3.js"></script>
  <script src="app-4.js"></script>
</body>
</html>
